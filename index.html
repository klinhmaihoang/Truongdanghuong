async function setupPushNotification(){
  if(!('Notification' in window))return;
  if(Notification.permission==='granted')return;
  if(Notification.permission==='denied')return;
  // Hiện banner hỏi sau 3 giây
  setTimeout(()=>{
    if(Notification.permission!=='default')return;
    showNotifBanner();
  },3000);
}

function showNotifBanner(){
  if(document.getElementById('notif-banner'))return;
  const banner=document.createElement('div');
  banner.id='notif-banner';
  banner.style.cssText='position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#1e1e2e;color:white;padding:12px 16px;border-radius:12px;font-size:13px;display:flex;align-items:center;gap:10px;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.3);max-width:320px;width:90%';
  banner.innerHTML=`
    <span style="font-size:20px">🔔</span>
    <div style="flex:1">
      <div style="font-weight:600;margin-bottom:2px">Bật thông báo</div>
      <div style="opacity:.7;font-size:11px">Nhận thông báo khi có task mới</div>
    </div>
    <button id="notif-allow" style="background:#4F46E5;border:none;color:white;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-weight:600">Bật</button>
    <button id="notif-deny" style="background:transparent;border:none;color:rgba(255,255,255,.5);padding:6px;cursor:pointer;font-size:16px">✕</button>
  `;
  document.body.appendChild(banner);
  document.getElementById('notif-allow').onclick=async()=>{
    banner.remove();
    const perm=await Notification.requestPermission();
    if(perm==='granted'){
      sendPushNotification('🔔 Thông báo đã bật!','Bạn sẽ nhận thông báo khi có task mới.');
    }
  };
  document.getElementById('notif-deny').onclick=()=>banner.remove();
}

function sendPushNotification(title, body, opts={}){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  try{
    const n=new Notification(title,{
      body,
      icon:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="%234F46E5"/><text y="22" x="6" font-size="18" fill="white">TT</text></svg>',
      badge:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="%234F46E5"/></svg>',
      tag:opts.tag||'tt-notif',
      ...opts
    });
    n.onclick=()=>{window.focus();n.close();};
    setTimeout(()=>n.close(),8000);
  }catch(e){}
}

          div({style:{fontSize:11,color:'var(--text3)'}},[user.role==='admin'?'👑 Admin':'👤 Thành viên']),

        btn({style:{fontSize:11,padding:'4px 8px',borderRadius:6,border:'1px solid #bfdbfe',background:'#eff6ff',color:'#1d4ed8',cursor:'pointer',marginRight:4},
          onClick:async()=>{
            const newPin=prompt('Nhập PIN mới 4 số cho '+user.name+':');
            if(!newPin||!/^\d{4}$/.test(newPin)){showToast('PIN phải là 4 chữ số!');return;}
            const pinHash=await hashPin(newPin);
            const updated=getUsers().map(u=>u.id===user.id?{...u,pinHash}:u);
            saveUsers(updated);
            // Nếu đang reset cho chính mình thì update session
            if(isSelf){saveCurrentUser({...S.currentUser,pinHash});extendSession();}
            showToast('✅ Đã đổi PIN cho '+user.name);
            renderList();
          }},['🔑 Đổi PIN']),

          onClick:()=>{
            if(!confirm('Xóa tài khoản '+user.name+'?'))return;
            const updated=getUsers().filter(u=>u.id!==user.id);
            saveUsers(updated);
            renderList();
          }},['Xóa']),

    el('option',{value:'admin'},['👑 Admin']),
  ]);
  const addErr=div({style:{color:'#ef4444',fontSize:12,marginBottom:8,minHeight:16}},[]);

  const addBtn=btn({className:'btn btn-primary',style:{width:'100%'},onClick:async()=>{
    const name=nameInp.value.trim();

    if(!name){addErr.textContent='Nhập tên!';return;}
    if(!/^\d{4}$/.test(pin)){addErr.textContent='PIN phải là 4 chữ số!';return;}
    const existing=getUsers();
    if(existing.find(u=>u.name.toLowerCase()===name.toLowerCase())){addErr.textContent='Tên đã tồn tại!';return;}
    addBtn.disabled=true;addBtn.textContent='Đang tạo...';
    const pinHash=await hashPin(pin);
    const newUser={id:'u_'+Date.now(),name,role,pinHash};
    saveUsers([...existing,newUser]);
    nameInp.value='';pinInp.value='';addErr.textContent='';
    addBtn.disabled=false;addBtn.textContent='+ Thêm';
    renderList();
  }},['+ Thêm']);

  const modalEl=div({className:'modal',style:{maxWidth:420}},[
    div({className:'modal-header'},[
      div({className:'modal-title'},['👥 Quản lý tài khoản']),
      btn({className:'modal-close',onClick:()=>setState({modal:null})},['×']),

      div({style:{fontWeight:600,fontSize:13,marginBottom:10,color:'var(--text1)'}},[' Thêm tài khoản mới']),
      nameInp,pinInp,roleSelect,addErr,addBtn,
    ]),
  ]);
  showModal(modalEl);
}

  const nameInp=inp({className:'input',placeholder:'Tên của bạn (Admin đầu tiên)',style:{marginBottom:12}});
  const pinInp=inp({className:'input',placeholder:'Tạo PIN 4 số',type:'password',maxLength:4,style:{marginBottom:8}});
  const pin2Inp=inp({className:'input',placeholder:'Nhập lại PIN',type:'password',maxLength:4,style:{marginBottom:12}});
  const errEl=div({style:{color:'#ef4444',fontSize:13,marginBottom:8,minHeight:18}},[]);

  const submitBtn=btn({className:'btn btn-primary',style:{width:'100%',padding:'12px'},onClick:async()=>{
    const name=nameInp.value.trim();
    const pin=pinInp.value.trim();
    const pin2=pin2Inp.value.trim();
    if(!name){errEl.textContent='Nhập tên!';return;}
    if(!/^\d{4}$/.test(pin)){errEl.textContent='PIN phải là 4 chữ số!';return;}
    if(pin!==pin2){errEl.textContent='PIN không khớp!';return;}
    submitBtn.disabled=true;submitBtn.textContent='Đang tạo...';
    const pinHash=await hashPin(pin);
    const admin={id:'u_'+Date.now(),name,role:'admin',pinHash};
    saveUsers([admin]);
    saveCurrentUser(admin);
    extendSession();
    setState({currentUser:admin});
  }},['Bắt đầu sử dụng →']);

  app.appendChild(div({style:{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--bg)',padding:20}},[
    div({style:{background:'white',borderRadius:'var(--r16)',padding:'32px 28px',boxShadow:'0 8px 32px rgba(0,0,0,.12)',width:'100%',maxWidth:360}},[
      div({style:{textAlign:'center',marginBottom:24}},[
        div({style:{width:56,height:56,borderRadius:16,background:'var(--accent)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 12px',color:'white',fontWeight:800,fontSize:22}},['TT']),
        div({style:{fontWeight:700,fontSize:20,color:'var(--text1)'}},[' Thiết lập lần đầu']),
        div({style:{fontSize:13,color:'var(--text3)',marginTop:4}},['Tạo tài khoản Admin đầu tiên']),
      ]),
      nameInp,pinInp,pin2Inp,errEl,submitBtn,
    ])
  ]));
}

function showLoginScreen(users){
  // Sync render - không fetch gì cả
  const app=document.getElementById('app');
  app.innerHTML='';

  const noUsers=users.length===0;
  if(noUsers){setTimeout(()=>renderFirstRunSetup(),0);return;}

  let selectedUser=null;
  let pinVal='';
  const errorEl=document.createElement('div');
  errorEl.style.cssText='color:#ef4444;font-size:13px;text-align:center;min-height:20px;margin-bottom:4px';
  // Quên PIN link
  const forgotPin=document.createElement('div');
  forgotPin.style.cssText='text-align:center;margin-top:12px;font-size:12px;color:var(--text3)';
  const forgotLink=document.createElement('button');
  forgotLink.textContent='Quên PIN?';
  forgotLink.style.cssText='background:none;border:none;color:var(--accent);cursor:pointer;font-size:12px;text-decoration:underline';
  forgotLink.onclick=()=>{
    alert('Liên hệ Admin để được reset PIN.\n\nAdmin có thể vào: Header → 👥 → chọn tên → 🔑 Đổi PIN');
  };
  forgotPin.appendChild(forgotLink);

  function updateDots(){
    for(let i=0;i<4;i++){
      const d=document.getElementById('dot_'+i);
      if(d)d.style.background=pinVal.length>i?'var(--accent)':'#e5e7eb';
    }
  }

  async function submitPin(){
    if(!selectedUser){errorEl.textContent='Chọn tên trước!';return;}
    if(pinVal.length<4){errorEl.textContent='Nhập đủ 4 số!';return;}
    const hashed=await hashPin(pinVal);
    if(hashed!==selectedUser.pinHash){
      errorEl.textContent='PIN không đúng!';
      pinVal='';updateDots();return;
    }
    saveCurrentUser(selectedUser);
    extendSession();
    S.currentUser=selectedUser;
    render();
  }

  function pressKey(k){
    if(k==='del'){pinVal=pinVal.slice(0,-1);}
    else if(pinVal.length<4){pinVal+=k;}
    updateDots();
    errorEl.textContent='';
    if(pinVal.length===4)setTimeout(submitPin,100);
  }

  // Dots
  const dotsRow=document.createElement('div');
  dotsRow.style.cssText='display:flex;gap:10px;justify-content:center;margin:16px 0';
  for(let i=0;i<4;i++){
    const d=document.createElement('div');
    d.id='dot_'+i;
    d.style.cssText='width:14px;height:14px;border-radius:50%;background:#e5e7eb;transition:background .1s';
    dotsRow.appendChild(d);
  }

  // Numpad
  const numpad=document.createElement('div');
  numpad.style.cssText='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:240px;margin:0 auto';
  [1,2,3,4,5,6,7,8,9,'',0,'del'].forEach(k=>{
    if(k===''){numpad.appendChild(document.createElement('div'));return;}
    const b=document.createElement('button');
    b.textContent=k==='del'?'⌫':String(k);
    b.style.cssText=`padding:16px;font-size:${k==='del'?18:20}px;font-weight:600;background:white;border:1px solid var(--border);border-radius:var(--r12);cursor:pointer;box-shadow:var(--s1);color:${k==='del'?'#ef4444':'var(--text1)'}`;
    b.onclick=()=>pressKey(String(k));
    numpad.appendChild(b);
  });

  // User list
  const userList=document.createElement('div');
  userList.style.cssText='display:flex;flex-direction:column;gap:6px;margin-bottom:16px';
  users.forEach(u=>{
    const ub=document.createElement('button');
    ub.className='user-btn';
    ub.style.cssText='padding:10px 14px;border-radius:var(--r8);border:2px solid var(--border);background:white;cursor:pointer;display:flex;align-items:center;gap:10px;transition:all .1s;text-align:left;width:100%';
    const avatar=document.createElement('div');
    avatar.style.cssText='width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:15px;flex-shrink:0';
    avatar.textContent=u.name[0].toUpperCase();
    const info=document.createElement('div');
    info.innerHTML=`<div style="font-weight:600;font-size:14px;color:var(--text1)">${u.name}</div><div style="font-size:12px;color:var(--text3)">${u.role==='admin'?'👑 Admin':'👤 Thành viên'}</div>`;
    ub.appendChild(avatar);ub.appendChild(info);
    ub.onclick=()=>{
      selectedUser=u;
      document.querySelectorAll('.user-btn').forEach(b=>Object.assign(b.style,{borderColor:'var(--border)',background:'white'}));
      Object.assign(ub.style,{borderColor:'var(--accent)',background:'var(--accent-bg)'});
      pinVal='';updateDots();errorEl.textContent='';
    };
    userList.appendChild(ub);
  });

  // Assemble
  const card=document.createElement('div');
  card.style.cssText='background:white;border-radius:var(--r16);padding:32px 28px;box-shadow:0 8px 32px rgba(0,0,0,.12);width:100%;max-width:360px';
  const logo=document.createElement('div');
  logo.style.cssText='text-align:center;margin-bottom:24px';
  logo.innerHTML=`<div style="width:56px;height:56px;border-radius:16px;background:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:white;font-weight:800;font-size:22px">TT</div><div style="font-weight:700;font-size:20px;color:var(--text1)">Task Tracker AI</div><div style="font-size:13px;color:var(--text3);margin-top:4px">Chọn tên và nhập PIN</div>`;
  card.appendChild(logo);
  card.appendChild(userList);
  card.appendChild(dotsRow);
  card.appendChild(errorEl);
  card.appendChild(numpad);
  card.appendChild(forgotPin);
  const wrap=document.createElement('div');
  wrap.style.cssText='min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px';
  wrap.appendChild(card);
  app.appendChild(wrap);
}

async function renderLoginScreen(){
  const cfg=getSyncCfg();
  let users=getUsers();
  if(cfg&&cfg.workerUrl){
    const cloudUsers=await getUsersFromCloud().catch(()=>null);
    if(cloudUsers&&cloudUsers.length>0)users=cloudUsers;
  }
  showLoginScreen(users);
}



// ─── Today View ───────────────────────────────────────────────────────────────
function renderTodayView(mobile){
  const wrap=div({style:{flex:1,minWidth:0,padding:mobile?'0':'0 0 0 0'}});
  const tasks=S.tasks||[];
  const cats=S.categories||[];
  const now=new Date();
  const todayMidnight=new Date();todayMidnight.setHours(0,0,0,0);

  // ── Smart sort ──
  // Group: overdue, personal (no category / personal cat), work tasks due today, upcoming
  const allActive=tasks.filter(t=>t.status!=='done');
  const overdueTasks=allActive.filter(t=>t.deadline&&diffMins(t.deadline)<0);
  const todayTasks=allActive.filter(t=>t.deadline&&diffDays(t.deadline)===0&&diffMins(t.deadline)>=0);
  const soon3=allActive.filter(t=>t.deadline&&diffDays(t.deadline)>0&&diffDays(t.deadline)<=3);
  const noDeadline=allActive.filter(t=>!t.deadline);
  const doneTodayTasks=tasks.filter(t=>t.status==='done').slice(0,5);

  // Personal vs work
  const myName=S.currentUser?.name||'';
  const isPersonal=t=>!t.categoryId||(cats.find(c=>c.id===t.categoryId)||{}).name?.toLowerCase().includes('cá nhân');

  const dayNames=['CN','T2','T3','T4','T5','T6','T7'];
  const monthNames=['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];
  const dateStr=dayNames[now.getDay()]+', '+now.getDate()+' '+monthNames[now.getMonth()]+' '+now.getFullYear();

  // ── Date header ──
  wrap.appendChild(div({style:{marginBottom:20}},[
    div({style:{fontSize:11,fontWeight:700,color:'var(--text3)',letterSpacing:'.12em',textTransform:'uppercase',marginBottom:2}},[dateStr]),
    div({style:{fontFamily:"'Playfair Display',Georgia,serif",fontSize:mobile?26:32,fontWeight:700,color:'var(--text1)',lineHeight:1.1,letterSpacing:'-.02em'}},['Hôm nay']),
    overdueTasks.length?div({style:{fontSize:13,color:'var(--red)',fontWeight:600,marginTop:4}},[overdueTasks.length+' việc quá hạn — cần xử lý ngay']):
    todayTasks.length?div({style:{fontSize:13,color:'var(--text2)',marginTop:4}},[todayTasks.length+' việc đến hạn hôm nay']):
    div({style:{fontSize:13,color:'var(--green)',marginTop:4}},['🎉 Không có việc nào quá hạn!']),
  ]));

  function makeTaskRow(t,showGroup){
    const cat=cats.find(c=>c.id===t.categoryId);
    const dl=deadlineStatus(t.deadline,t.status);
    const isDone=t.status==='done';
    const row=div({style:{
      display:'flex',alignItems:'center',gap:10,padding:'11px 0',
      borderBottom:'1px solid var(--border)',cursor:'pointer',
      opacity:isDone?.6:1,
    }});
    row.addEventListener('click',()=>openTaskModal(S.tasks.find(x=>x.id===t.id)));

    // Circle checkbox
    const circle=div({style:{
      width:22,height:22,borderRadius:'50%',flexShrink:0,
      border:isDone?'none':'2px solid '+(dl?.border||'var(--border2)'),
      background:isDone?'var(--green)':'transparent',
      display:'flex',alignItems:'center',justifyContent:'center',
      cursor:'pointer',
    }});
    if(isDone)circle.innerHTML='<svg width="12" height="9" viewBox="0 0 12 9" fill="none"><path d="M1 4.5L4.5 8L11 1" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>';
    circle.addEventListener('click',e=>{
      e.stopPropagation();
      const task=S.tasks.find(x=>x.id===t.id);
      if(!task)return;
      const updated={...task,status:isDone?'todo':'done',progress:isDone?0:100};
      saveTasks(S.tasks.map(x=>x.id===t.id?updated:x));
    });

    const body=div({style:{flex:1,minWidth:0}});
    const titleRow=div({style:{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}});
    titleRow.appendChild(span({style:{fontSize:14,fontWeight:600,color:'var(--text1)',textDecoration:isDone?'line-through':'none'}},[t.title]));
    if(t.priority==='high')titleRow.appendChild(span({style:{fontSize:16,lineHeight:1}},['🚩']));
    body.appendChild(titleRow);

    const meta=div({style:{display:'flex',alignItems:'center',gap:6,marginTop:4,flexWrap:'wrap',minWidth:0}});
    if(t.deadline&&!isDone){
      const timeStr=t.deadline.includes('T')&&!t.deadline.endsWith('T00:00')?new Date(t.deadline).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}):'Cả ngày';
      meta.appendChild(span({style:{fontSize:12,color:dl?.c||'var(--text3)',fontWeight:600,flexShrink:0}},[timeStr]));
    }
    if(dl&&!isDone)meta.appendChild(span({style:{fontSize:11,background:dl.bg,color:dl.c,border:'1px solid '+dl.border,borderRadius:100,padding:'1px 8px',fontWeight:600,flexShrink:0,whiteSpace:'nowrap'}},[dl.icon+' '+dl.label]));
    // Assignee on new line to avoid overlap
    const metaBottom=div({style:{display:'flex',alignItems:'center',gap:6,marginTop:3,flexWrap:'wrap'}});
    if(cat)metaBottom.appendChild(span({style:{fontSize:11,color:cat.color,background:cat.color+'18',padding:'1px 7px',borderRadius:100,whiteSpace:'nowrap'}}),[cat.icon+' '+cat.name]);
    if(t.assignee&&t.assignee!==myName)metaBottom.appendChild(span({style:{fontSize:11,color:'var(--text3)',display:'flex',alignItems:'center',gap:3,whiteSpace:'nowrap'}},[
      div({style:{width:16,height:16,borderRadius:'50%',background:'var(--surface3)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:8,fontWeight:700,color:'var(--text2)'}},[initials(t.assignee)]),
      t.assignee,
    ]));
    body.appendChild(meta);
    if(metaBottom.children.length)body.appendChild(metaBottom);

    row.appendChild(circle);
    row.appendChild(body);
    return row;
  }

  function makeSection(label,items,accent='var(--text2)'){
    if(!items.length)return null;
    const sec=div({style:{marginBottom:20}});
    sec.appendChild(div({style:{fontSize:11,fontWeight:700,color:accent,letterSpacing:'.06em',textTransform:'uppercase',marginBottom:8,display:'flex',alignItems:'center',gap:6}},[
      span({style:{display:'inline-block',width:20,height:1.5,background:accent,borderRadius:2,marginRight:2}},[]),
      label+' · '+items.length,
    ]));
    items.forEach(t=>sec.appendChild(makeTaskRow(t)));
    return sec;
  }

  const overdueSection=makeSection('QUÁ HẠN',overdueTasks,'var(--red)');
  const todaySection=makeSection('HÔM NAY',todayTasks,'var(--amber)');
  const soonSection=makeSection('SẮP HẾT HẠN (3 ngày)',soon3,'var(--blue)');
  const noDeadlineSection=makeSection('KHÔNG CÓ DEADLINE',noDeadline.slice(0,8),'var(--text3)');
  const doneSection=makeSection('ĐÃ HOÀN THÀNH GẦN ĐÂY',doneTodayTasks,'var(--green)');

  const inner=div({style:{maxWidth:640,margin:'0 auto',padding:mobile?'0':'0 8px'}});
  if(overdueSection)inner.appendChild(overdueSection);
  if(todaySection)inner.appendChild(todaySection);
  if(soonSection)inner.appendChild(soonSection);
  if(noDeadlineSection)inner.appendChild(noDeadlineSection);
  if(doneSection)inner.appendChild(doneSection);

  if(!overdueTasks.length&&!todayTasks.length&&!soon3.length&&!noDeadline.length){
    inner.appendChild(div({style:{textAlign:'center',padding:'64px 0',color:'var(--text3)'}},[
      div({style:{fontSize:48,marginBottom:12}},['🌿']),
      div({style:{fontSize:16,fontWeight:600,color:'var(--text2)',marginBottom:4}},['Tất cả việc đã hoàn thành!']),
      div({style:{fontSize:13}},['Không có task nào cần xử lý hôm nay.']),
    ]));
  }

  // Quick add button
  inner.appendChild(div({style:{paddingTop:8,marginBottom:40}},[
    btn({className:'btn btn-primary',style:{width:'100%',padding:'12px',fontSize:14},onClick:()=>openTaskModal(null)},['+ Thêm task mới']),
  ]));

  wrap.appendChild(inner);
  return wrap;
}

// ─── Dashboard View ────────────────────────────────────────────────────────────
function renderDashboardView(mobile){
  const wrap=div({style:{flex:1,minWidth:0}});
  const tasks=S.tasks||[];
  const cats=S.categories||[];
  const now=new Date();
  const doneCount=tasks.filter(t=>t.status==='done').length;
  const totalCount=tasks.length;
  const inprogressCount=tasks.filter(t=>t.status==='inprogress').length;
  const overdueCount=tasks.filter(t=>t.status!=='done'&&t.deadline&&diffMins(t.deadline)<0).length;
  const pct=totalCount?Math.round(doneCount/totalCount*100):0;
  const catStats=cats.map(c=>{
    const ct=tasks.filter(t=>t.categoryId===c.id);
    const cdone=ct.filter(t=>t.status==='done').length;
    return{...c,total:ct.length,done:cdone,pct:ct.length?Math.round(cdone/ct.length*100):0};
  }).filter(c=>c.total>0).sort((a,b)=>b.total-a.total);
  const assignees=[...new Set(tasks.filter(t=>t.assignee).map(t=>t.assignee))];
  const assigneeStats=assignees.map(a=>{
    const at=tasks.filter(t=>t.assignee===a);
    const ad=at.filter(t=>t.status==='done').length;
    const ao=at.filter(t=>t.status!=='done'&&t.deadline&&diffMins(t.deadline)<0).length;
    return{name:a,total:at.length,done:ad,overdue:ao,pct:at.length?Math.round(ad/at.length*100):0};
  }).sort((a,b)=>b.total-a.total);
  const weekNum=Math.ceil((now-new Date(now.getFullYear(),0,1))/604800000);

  const inner=div({style:{maxWidth:900,margin:'0 auto'}});

  // Header
  const hdr=div({style:{marginBottom:24}});
  hdr.appendChild(div({style:{fontSize:11,fontWeight:600,color:'var(--text3)',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:4}},['Tuần '+weekNum+', '+now.getFullYear()]));
  hdr.appendChild(div({style:{fontFamily:"'Playfair Display',Georgia,serif",fontSize:mobile?26:32,fontWeight:400,color:'var(--text1)',lineHeight:1.1,letterSpacing:'-.02em'}},['Bảng điều khiển']));
  inner.appendChild(hdr);

  // Big number card
  const card=div({style:{background:'var(--surface)',borderRadius:20,padding:mobile?'20px':'28px',marginBottom:16,border:'1px solid var(--border)',boxShadow:'var(--s2)',position:'relative',overflow:'hidden'}});
  card.appendChild(div({style:{position:'absolute',top:'-20px',right:'-20px',width:'120px',height:'120px',background:'var(--green-bg)',borderRadius:'50%',opacity:.4}},[]));
  card.appendChild(div({style:{fontSize:11,fontWeight:600,color:'var(--text3)',letterSpacing:'.08em',textTransform:'uppercase',marginBottom:8}},['Tuần này, tôi đã hoàn thành']));
  const bigRow=div({style:{display:'flex',alignItems:'flex-end',gap:12,marginBottom:16}});
  bigRow.appendChild(div({style:{fontFamily:"'Playfair Display',Georgia,serif",fontSize:mobile?52:72,fontWeight:400,color:'var(--text1)',lineHeight:1,letterSpacing:'-.03em'}},[String(doneCount)]));
  const bigLbl=div({style:{paddingBottom:10}});
  bigLbl.appendChild(div({style:{fontSize:15,fontWeight:700,color:'var(--green)'}},['task hoàn thành']));
  if(inprogressCount)bigLbl.appendChild(div({style:{fontSize:12,color:'var(--text3)',marginTop:3}},['+ '+inprogressCount+' đang làm']));
  bigRow.appendChild(bigLbl);
  card.appendChild(bigRow);
  // Progress bar
  const pbWrap=div({style:{marginBottom:14}});
  const pbTop=div({style:{display:'flex',justifyContent:'space-between',marginBottom:6}});
  pbTop.appendChild(div({style:{fontSize:12,color:'var(--text3)'}},['Tổng tiến độ']));
  pbTop.appendChild(div({style:{fontSize:12,fontWeight:700,color:'var(--text1)'}},[doneCount+' / '+totalCount+' task']));
  pbWrap.appendChild(pbTop);
  const pbTrack=div({style:{height:'8px',background:'var(--surface3)',borderRadius:100,overflow:'hidden'}});
  pbTrack.appendChild(div({style:{height:'100%',width:pct+'%',background:'linear-gradient(90deg,var(--green),#34D399)',borderRadius:100,transition:'width .6s ease'}},[]));
  pbWrap.appendChild(pbTrack);
  const pbBot=div({style:{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--text3)',marginTop:5}});
  pbBot.appendChild(span({},[pct+'% mục tiêu']));
  if(overdueCount)pbBot.appendChild(span({style:{color:'var(--red)',fontWeight:600}},[overdueCount+' quá hạn']));
  pbWrap.appendChild(pbBot);
  card.appendChild(pbWrap);
  // Metric pills
  const pills=div({style:{display:'flex',gap:8,flexWrap:'wrap'}});
  [{label:'Cần làm',value:tasks.filter(t=>t.status==='todo').length,c:'#3b82f6',bg:'#eff6ff'},{label:'Đang làm',value:inprogressCount,c:'#d97706',bg:'#fffbeb'},{label:'Quá hạn',value:overdueCount,c:'var(--red)',bg:'var(--red-bg)'}].forEach(m=>{
    const p=div({style:{background:m.bg,borderRadius:100,padding:'5px 14px',display:'flex',gap:6,alignItems:'center',border:'1px solid '+m.c+'20'}});
    p.appendChild(span({style:{fontSize:18,fontFamily:"'Playfair Display',Georgia,serif",fontWeight:400,color:m.c}},[String(m.value)]));
    p.appendChild(span({style:{fontSize:12,color:m.c,opacity:.85}},[m.label]));
    pills.appendChild(p);
  });
  card.appendChild(pills);

  // Category breakdown

    catSec.appendChild(div({style:{fontSize:11,fontWeight:600,color:'var(--text3)',letterSpacing:'.08em',textTransform:'uppercase',marginBottom:12}},['— Theo nhóm']));
    const catGrid=div({style:{display:'grid',gridTemplateColumns:mobile?'1fr':catStats.length>=3?'repeat(3,1fr)':'repeat(2,1fr)',gap:10}});
    catStats.forEach(c=>{
      const cc=div({style:{background:'var(--surface)',borderRadius:'var(--r12)',padding:'14px 16px',border:'1px solid var(--border)',borderTop:'3px solid '+c.color}});
      const ch=div({style:{display:'flex',alignItems:'center',gap:8,marginBottom:10}});
      ch.appendChild(div({style:{fontSize:18}},[c.icon]));
      ch.appendChild(div({style:{fontSize:13,fontWeight:700,color:'var(--text1)',flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},[c.name]));
      ch.appendChild(div({style:{fontSize:12,fontWeight:700,color:c.color}},[c.pct+'%']));
      cc.appendChild(ch);
      const cbTrack=div({style:{height:'6px',background:'var(--surface3)',borderRadius:100,overflow:'hidden',marginBottom:8}});
      cbTrack.appendChild(div({style:{height:'100%',width:c.pct+'%',background:c.color,borderRadius:100}},[]));
      cc.appendChild(cbTrack);
      cc.appendChild(div({style:{fontSize:11,color:'var(--text3)'}},[c.done+'/'+c.total+' hoàn thành']));
      catGrid.appendChild(cc);
    });
    catSec.appendChild(catGrid);
    inner.appendChild(catSec);
  }

  // Assignee stats
  if(assigneeStats.length){
    const asSec=div({style:{background:'var(--surface)',borderRadius:'var(--r12)',padding:'16px',border:'1px solid var(--border)',boxShadow:'var(--s1)',marginBottom:16}});
    asSec.appendChild(div({style:{fontSize:11,fontWeight:600,color:'var(--text3)',letterSpacing:'.08em',textTransform:'uppercase',marginBottom:12}},['— Theo nhân viên']));
    assigneeStats.slice(0,8).forEach(a=>{
      const ar=div({style:{display:'flex',alignItems:'center',gap:10,marginBottom:10}});
      const av=div({style:{width:32,height:32,borderRadius:'50%',background:'var(--accent)',display:'flex',alignItems:'center',justifyContent:'center',color:'white',fontWeight:700,fontSize:13,flexShrink:0}});
      av.textContent=a.name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
      ar.appendChild(av);
      const ai=div({style:{flex:1,minWidth:0}});
      const aiTop=div({style:{display:'flex',justifyContent:'space-between',marginBottom:3}});
      aiTop.appendChild(span({style:{fontSize:13,fontWeight:600,color:'var(--text1)'}},[a.name]));
      aiTop.appendChild(span({style:{fontSize:12,fontWeight:700,color:'var(--green)'}},[a.pct+'%']));
      ai.appendChild(aiTop);
      const aiTrack=div({style:{height:'5px',background:'var(--surface3)',borderRadius:100,overflow:'hidden'}});
      aiTrack.appendChild(div({style:{height:'100%',width:a.pct+'%',background:a.pct>=75?'var(--green)':a.pct>=40?'#3b82f6':'#f59e0b',borderRadius:100}},[]));
      ai.appendChild(aiTrack);
      ai.appendChild(div({style:{fontSize:11,color:'var(--text3)',marginTop:2}},[a.done+'/'+a.total+(a.overdue?' · '+a.overdue+' quá hạn':'')]));
      ar.appendChild(ai);
      asSec.appendChild(ar);
    });
    inner.appendChild(asSec);
  }

  // Recent completions
  const recSec=div({style:{marginBottom:40}});
  recSec.appendChild(div({style:{fontSize:11,fontWeight:600,color:'var(--text3)',letterSpacing:'.08em',textTransform:'uppercase',marginBottom:12}},['— Hoàn thành gần đây']));
  const doneTasks=tasks.filter(t=>t.status==='done').slice(-6).reverse();
  if(!doneTasks.length){
    recSec.appendChild(div({style:{textAlign:'center',padding:'32px 0',color:'var(--text3)',fontSize:13}},['Chưa có task nào hoàn thành']));
  } else {
    doneTasks.forEach(t=>{
      const cat=cats.find(c=>c.id===t.categoryId);
      const row=div({style:{display:'flex',alignItems:'center',gap:10,padding:'8px 0',borderBottom:'1px solid var(--border)'}});
      row.appendChild(div({style:{color:'var(--green)',fontSize:16,flexShrink:0}},['✅']));
      const ri=div({style:{flex:1,minWidth:0}});
      ri.appendChild(div({style:{fontSize:13,fontWeight:600,color:'var(--text2)',textDecoration:'line-through',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},[t.title]));
      if(cat)ri.appendChild(div({style:{fontSize:11,color:cat.color}},[cat.icon+' '+cat.name]));
      row.appendChild(ri);
      if(t.assignee)row.appendChild(div({style:{fontSize:11,color:'var(--text3)',flexShrink:0}},[t.assignee]));
      recSec.appendChild(row);
    });
  }
  inner.appendChild(recSec);
  wrap.appendChild(inner);
  return wrap;
}

// ─── Calendar View ─────────────────────────────────────────────────────────────
function renderCalendarView(mobile){
  const wrap=div({style:{flex:1,minWidth:0}});
  const tasks=S.tasks||[];
  const cats=S.categories||[];

  const stateKey='tt_cal_month';
  const stored=lsGet(stateKey);
  const viewDate=stored?new Date(stored):new Date();
  const year=viewDate.getFullYear();
  const month=viewDate.getMonth();

  const firstDay=new Date(year,month,1);
  const lastDay=new Date(year,month+1,0);
  const startOffset=firstDay.getDay(); // 0=Sun
  const totalCells=Math.ceil((startOffset+lastDay.getDate())/7)*7;

  const todayD=new Date();todayD.setHours(0,0,0,0);

  const monthNames=['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];
  const dayNames=['T2','T3','T4','T5','T6','T7','CN'];

  // Prev/next
  const prevMonth=()=>{const d=new Date(year,month-1,1);lsSet(stateKey,d.toISOString());render();}
  const nextMonth=()=>{const d=new Date(year,month+1,1);lsSet(stateKey,d.toISOString());render();}

  // Build calendar
  const header=div({style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}});
  header.appendChild(div({style:{fontFamily:"'Playfair Display',Georgia,serif",fontSize:mobile?20:26,fontWeight:400,color:'var(--text1)',letterSpacing:'-.01em'}},[monthNames[month]+' '+year]));
  const navBtns=div({style:{display:'flex',gap:6}});
  navBtns.appendChild(btn({className:'btn btn-secondary',style:{padding:'5px 14px',fontSize:14,borderRadius:'var(--r8)'},onClick:prevMonth},['‹']));
  navBtns.appendChild(btn({className:'btn btn-secondary',style:{padding:'5px 12px',fontSize:12,borderRadius:'var(--r8)'},onClick:()=>{lsSet(stateKey,new Date().toISOString());render()}},['Hôm nay']));
  navBtns.appendChild(btn({className:'btn btn-secondary',style:{padding:'5px 14px',fontSize:14,borderRadius:'var(--r8)'},onClick:nextMonth},['›']));
  header.appendChild(navBtns);
  wrap.appendChild(header);

  // Day of week headers
  const grid=div({style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'4px',width:'100%'}});
  dayNames.forEach(d=>{
    const dh=div({style:{textAlign:'center',fontSize:11,fontWeight:700,color:'var(--text3)',padding:'6px 0 8px',letterSpacing:'.06em',textTransform:'uppercase'}});
    dh.textContent=d;
    grid.appendChild(dh);
  });

  // Build tasks map per date
  function getTasksForDate(d){
    const ds=new Date(year,month,d);
    ds.setHours(0,0,0,0);
    const de=new Date(ds);de.setDate(de.getDate()+1);
    return tasks.filter(t=>{
      if(!t.deadline)return false;
      const td=new Date(t.deadline);
      return td>=ds&&td<de;
    });
  }

  // Tasks chỉ hiện ở đúng ngày deadline (không dùng ngày tạo làm start)
  // Span bar chỉ dùng khi task có field startDate riêng (hiện chưa có)
  const spanTasks=[];

  // Adjust start offset to Monday-first (0=Mon, 6=Sun)
  const moOffset=(startOffset+6)%7;

  for(let i=0;i<totalCells;i++){
    const dayN=i-moOffset+1;
    const isCurrentMonth=dayN>=1&&dayN<=lastDay.getDate();
    const thisDate=isCurrentMonth?new Date(year,month,dayN):null;
    if(thisDate)thisDate.setHours(0,0,0,0);
    const isToday=thisDate&&thisDate.getTime()===todayD.getTime();
    const dayTasks=isCurrentMonth?getTasksForDate(dayN):[];
    const hasOverdue=dayTasks.some(t=>t.status!=='done'&&diffMins(t.deadline)<0);

    // Build cell with inline styles (not relying on CSS classes)
    const cellBg = isToday ? 'var(--accent-bg)' : !isCurrentMonth ? 'var(--bg)' : 'var(--surface)';
    const cellBorder = isToday ? '2px solid var(--gh-amber)' : '1px solid var(--border)';
    const cell=div({style:{
      background:cellBg,
      border:cellBorder,
      borderRadius:'var(--r8)',
      padding:'5px 6px',
      minHeight: mobile?'60px':'88px',
      cursor: isCurrentMonth?'pointer':'default',
      overflow:'hidden',
      transition:'background .12s',
    }});
    if(isCurrentMonth) cell.addEventListener('click',()=>openTaskModal(null));

    // Day number
    const dayNumEl=div({style:{
      fontSize:mobile?11:12,
      fontWeight: isToday?700:isCurrentMonth?500:400,
      color: isToday?'var(--gh-amber)':!isCurrentMonth?'var(--text3)':'var(--text2)',
      marginBottom:3,
      display:'flex',justifyContent:'space-between',alignItems:'center',
    }});
    dayNumEl.appendChild(document.createTextNode(String(isCurrentMonth?dayN:'')));
    if(hasOverdue) { const dot=div({style:{width:6,height:6,borderRadius:'50%',background:'var(--red)',flexShrink:0}}); dayNumEl.appendChild(dot); }
    else if(dayTasks.length>0) { const dot=div({style:{width:6,height:6,borderRadius:'50%',background:'var(--green)',flexShrink:0}}); dayNumEl.appendChild(dot); }
    cell.appendChild(dayNumEl);

    // Span tasks bars (Gantt-like)
    spanTasks.forEach(t=>{
      if(!thisDate)return;
      const parts=(t.date||'').split('/');
      if(parts.length<3)return;
      const startD=new Date(parts[2],parts[1]-1,parts[0]);startD.setHours(0,0,0,0);
      const endD=new Date(t.deadline);endD.setHours(0,0,0,0);
      if(thisDate<startD||thisDate>endD)return;
      const cat=cats.find(c=>c.id===t.categoryId);
      const isStart=thisDate.getTime()===startD.getTime();
      const isEnd=thisDate.getTime()===endD.getTime();
      const isOverdue=t.status!=='done'&&diffMins(t.deadline)<0;
      // Color by STATUS
      let barBg, barText;
      if(t.status==='done'){barBg='#16A34A';barText='#fff';}
      else if(isOverdue){barBg='#DC2626';barText='#fff';}
      else if(t.status==='inprogress'){barBg='#2563EB';barText='#fff';}
      else{barBg=cat?cat.color:'#6366F1';barText='#fff';}
      const bar=div({style:{
        height:16,background:barBg,color:barText,
        opacity:t.status==='done'?.65:1,
        borderRadius:isStart&&isEnd?4:isStart?'4px 0 0 4px':isEnd?'0 4px 4px 0':'0',
        marginBottom:2,overflow:'hidden',padding:'0 5px',
        fontSize:10,fontWeight:600,
        display:'flex',alignItems:'center',whiteSpace:'nowrap',
        cursor:'pointer',transition:'filter .1s',
        textDecoration:t.status==='done'?'line-through':'none',
        textDecorationColor:'rgba(255,255,255,.6)',
      }});
      if(isStart){
        // Add status icon prefix
        const icon=t.status==='done'?'✓ ':isOverdue?'! ':t.status==='inprogress'?'▶ ':'○ ';
        bar.textContent=icon+t.title.slice(0,mobile?7:13)+(t.title.length>13?'…':'');
      }
      bar.addEventListener('mouseenter',()=>{bar.style.filter='brightness(1.12)';});
      bar.addEventListener('mouseleave',()=>{bar.style.filter='';});
      bar.addEventListener('click',e=>{e.stopPropagation();openTaskModal(S.tasks.find(x=>x.id===t.id));});
      cell.appendChild(bar);
    });

    // Single-day tasks (pills)
    dayTasks.filter(t=>!spanTasks.find(s=>s.id===t.id)).slice(0,mobile?2:3).forEach(t=>{
      const cat=cats.find(c=>c.id===t.categoryId);
      const isOverdue=t.status!=='done'&&diffMins(t.deadline)<0;
      // Color by STATUS — clear semantic colors
      let pillBg,pillText,pillBorder,statusIcon;
      if(t.status==='done'){
        pillBg='#DCFCE7';pillText='#15803D';pillBorder='#86EFAC';statusIcon='✓';
      } else if(isOverdue){
        pillBg='#FEE2E2';pillText='#B91C1C';pillBorder='#FCA5A5';statusIcon='!';
      } else if(t.status==='inprogress'){
        pillBg='#DBEAFE';pillText='#1D4ED8';pillBorder='#93C5FD';statusIcon='▶';
      } else {
        // todo — use category color lightly
        const c=cat?cat.color:'#6366F1';
        pillBg=c+'18';pillText=c;pillBorder=c+'40';statusIcon='○';
      }
      const pill=div({style:{
        fontSize:10,fontWeight:500,
        background:pillBg,color:pillText,
        border:'1px solid '+pillBorder,
        borderRadius:4,padding:'1px 5px',marginBottom:2,
        overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',
        cursor:'pointer',transition:'opacity .1s',display:'flex',alignItems:'center',gap:3,
        textDecoration:t.status==='done'?'line-through':'none',
        textDecorationColor:pillText+'80',
      }});
      const timeStr=t.deadline&&t.deadline.includes('T')&&!t.deadline.endsWith('T00:00')?new Date(t.deadline).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})+' ':'';
      // Status icon
      const iconSpan=document.createElement('span');
      iconSpan.textContent=statusIcon;
      iconSpan.style.cssText='font-size:9px;flex-shrink:0;opacity:.8';
      pill.appendChild(iconSpan);
      const txtSpan=document.createElement('span');
      txtSpan.style.cssText='overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
      txtSpan.textContent=(timeStr||'')+t.title.slice(0,mobile?8:12);
      pill.appendChild(txtSpan);
      pill.addEventListener('mouseenter',()=>{pill.style.opacity='.75';});
      pill.addEventListener('mouseleave',()=>{pill.style.opacity='1';});
      pill.addEventListener('click',e=>{e.stopPropagation();openTaskModal(S.tasks.find(x=>x.id===t.id));});
      cell.appendChild(pill);
    });
    const singleDayTasks=dayTasks.filter(t=>!spanTasks.find(s=>s.id===t.id));
    if(singleDayTasks.length>(mobile?2:3)){
      const hidden=singleDayTasks.length-(mobile?2:3);
      const moreBtn=document.createElement('div');
      moreBtn.textContent='+'+hidden+' nữa';
      moreBtn.style.cssText='font-size:10px;color:var(--gh-amber);font-weight:600;padding:1px 3px;cursor:pointer;margin-top:1px;';
      moreBtn.addEventListener('mouseenter',()=>{moreBtn.style.textDecoration='underline';});
      moreBtn.addEventListener('mouseleave',()=>{moreBtn.style.textDecoration='none';});
      moreBtn.addEventListener('click',e=>{
        e.stopPropagation();
        const dayLabel=thisDate?thisDate.toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'numeric',year:'numeric'}):'';
        const allCats=S.categories||[];
        const modalEl=div({className:'modal',style:{maxWidth:420}});
        modalEl.appendChild(div({className:'modal-header'},[
          div({className:'modal-title'},['📅 '+dayLabel]),
          btn({className:'modal-close',onClick:()=>setState({modal:null,modalData:null})},['×']),
        ]));
        const list=div({style:{display:'flex',flexDirection:'column',gap:6}});
        singleDayTasks.forEach(t=>{
          const cat=allCats.find(c=>c.id===t.categoryId);
          const isOverdue=t.status!=='done'&&diffMins(t.deadline)<0;
          let bg,tc,border,icon;
          if(t.status==='done'){bg='#DCFCE7';tc='#15803D';border='#86EFAC';icon='✓';}
          else if(isOverdue){bg='#FEE2E2';tc='#B91C1C';border='#FCA5A5';icon='!';}
          else if(t.status==='inprogress'){bg='#DBEAFE';tc='#1D4ED8';border='#93C5FD';icon='▶';}
          else{bg=cat?cat.color+'15':'#EEF2FF';tc=cat?cat.color:'#6366F1';border=cat?cat.color+'30':'#C7D2FE';icon='○';}
          const row=div({style:{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderRadius:'var(--r8)',background:bg,border:'1px solid '+border,cursor:'pointer',transition:'opacity .12s'}});
          row.addEventListener('mouseenter',()=>{row.style.opacity='.85';});
          row.addEventListener('mouseleave',()=>{row.style.opacity='1';});
          row.addEventListener('click',()=>{setState({modal:null,modalData:null});openTaskModal(S.tasks.find(x=>x.id===t.id));});
          const iconEl=div({style:{width:22,height:22,borderRadius:'50%',background:'rgba(255,255,255,.6)',border:'1.5px solid '+border,display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,color:tc,flexShrink:0}},[icon]);
          row.appendChild(iconEl);
          const info=div({style:{flex:1,minWidth:0}});
          info.appendChild(div({style:{fontSize:13,fontWeight:600,color:tc,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',textDecoration:t.status==='done'?'line-through':'none'}},[t.title]));
          const meta=div({style:{display:'flex',alignItems:'center',gap:4,marginTop:2,flexWrap:'wrap',fontSize:11,color:'var(--text3)'}});
          if(t.deadline&&t.deadline.includes('T')&&!t.deadline.endsWith('T00:00')){
            meta.appendChild(span({style:{color:tc,opacity:.8}},[new Date(t.deadline).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})]));
          }
          if(t.assignee)meta.appendChild(span({},[' · '+t.assignee]));
          if(cat)meta.appendChild(span({style:{color:tc,opacity:.7}},[' · '+cat.icon+' '+cat.name]));
          info.appendChild(meta);
          row.appendChild(info);
          list.appendChild(row);
        });
        modalEl.appendChild(list);
        modalEl.appendChild(div({style:{paddingTop:14,marginTop:8,borderTop:'1px solid var(--border)',display:'flex',justifyContent:'flex-end'}},[
          btn({className:'btn btn-secondary',style:{fontSize:12},onClick:()=>setState({modal:null,modalData:null})},['Đóng']),
        ]));
        showModal(modalEl);
      });
      cell.appendChild(moreBtn);
    }

    grid.appendChild(cell);
  }

  wrap.appendChild(grid);

  // Legend
  const legend=div({style:{display:'flex',alignItems:'center',gap:mobile?10:16,marginTop:14,padding:'10px 14px',background:'var(--surface)',borderRadius:'var(--r8)',border:'1px solid var(--border)',flexWrap:'wrap'}});
  [
    {icon:'○',label:'Chưa làm',bg:'#EEF2FF',c:'#6366F1',border:'#C7D2FE'},
    {icon:'▶',label:'Đang làm',bg:'#DBEAFE',c:'#1D4ED8',border:'#93C5FD'},
    {icon:'✓',label:'Hoàn thành',bg:'#DCFCE7',c:'#15803D',border:'#86EFAC'},
    {icon:'!',label:'Quá hạn',bg:'#FEE2E2',c:'#B91C1C',border:'#FCA5A5'},
  ].forEach(item=>{
    const chip=div({style:{display:'flex',alignItems:'center',gap:5}});
    chip.appendChild(div({style:{
      background:item.bg,color:item.c,border:'1px solid '+item.border,
      borderRadius:3,padding:'1px 7px',fontSize:10,fontWeight:600,
      display:'flex',alignItems:'center',gap:3,
    }},[ item.icon+' '+item.label ]));
    legend.appendChild(chip);
  });
  wrap.appendChild(legend);

  wrap.appendChild(div({style:{height:32}}));
  return wrap;
}

// ─── Archived View ────────────────────────────────────────────────────────────
function renderArchivedView(mobile){
  const wrap=div({style:{padding:mobile?'12px':'20px',maxWidth:900,margin:'0 auto'}});
  const workerUrl=(getSyncCfg()||{}).workerUrl;

  wrap.appendChild(div({style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}},[
    div({style:{fontWeight:700,fontSize:18,color:'var(--text1)'}},[' 📦 Task đã lưu trữ']),
    div({style:{fontSize:12,color:'var(--text3)'}},[' Task hoàn thành sẽ tự archive sau 24h']),
  ]));

  if(!workerUrl){
    wrap.appendChild(div({style:{textAlign:'center',padding:40,color:'var(--text3)'}},[' Cần kết nối Cloud Sync']));
    return wrap;
  }

  const listEl=div({});
  wrap.appendChild(listEl);

  const loadingEl=div({style:{textAlign:'center',padding:40,color:'var(--text3)'}},[' Đang tải...']);
  listEl.appendChild(loadingEl);

  const cats=S.categories||[];

  fetch(workerUrl+'/archived?limit=50').then(r=>r.json()).then(data=>{
    loadingEl.remove();
    const tasks=data.tasks||[];
    if(!tasks.length){
      listEl.appendChild(div({style:{textAlign:'center',padding:40,color:'var(--text3)',fontSize:14}},[' Chưa có task nào được lưu trữ']));
      return;
    }

    // Summary
    listEl.appendChild(div({style:{fontSize:13,color:'var(--text3)',marginBottom:12}},['Tổng '+data.total+' task đã lưu trữ']));

    tasks.forEach(t=>{
      const cat=cats.find(c=>c.id===t.category_id);
      const card=div({style:{
        background:'white',borderRadius:'var(--r12)',padding:'12px 16px',marginBottom:8,
        border:'1px solid var(--border)',boxShadow:'var(--s1)',
        display:'flex',alignItems:'flex-start',gap:12,opacity:.85
      }});

      const info=div({style:{flex:1,minWidth:0}});
      info.appendChild(div({style:{fontWeight:600,fontSize:13,color:'var(--text1)',marginBottom:4,textDecoration:'line-through',opacity:.7}},[t.title]));
      const meta=div({style:{display:'flex',flexWrap:'wrap',gap:6,fontSize:11,color:'var(--text3)'}});
      if(t.assignee)meta.appendChild(span({style:{background:'#f3f4f6',padding:'2px 6px',borderRadius:4}},[' 👤 '+t.assignee]));
      if(cat)meta.appendChild(span({style:{background:'#f3f4f6',padding:'2px 6px',borderRadius:4}},[cat.icon+' '+cat.name]));
      if(t.archived_at)meta.appendChild(span({style:{background:'#f0fdf4',padding:'2px 6px',borderRadius:4,color:'#16a34a'}},['✅ '+new Date(t.archived_at).toLocaleDateString('vi-VN')]));
      info.appendChild(meta);
      if(t.notes)info.appendChild(div({style:{fontSize:11,color:'var(--text3)',marginTop:4,fontStyle:'italic'}},['📌 '+t.notes]));
      card.appendChild(info);

      // Restore button
      const restoreBtn=btn({style:{fontSize:11,padding:'5px 10px',borderRadius:6,border:'1px solid #bfdbfe',background:'#eff6ff',color:'#1d4ed8',cursor:'pointer',flexShrink:0,whiteSpace:'nowrap'},
        onClick:async()=>{
          if(!confirm('Khôi phục task "'+t.title+'"?'))return;
          restoreBtn.disabled=true;restoreBtn.textContent='Đang khôi phục...';
          try{
            const res=await fetch(workerUrl+'/restore/'+t.id,{method:'POST'});
            if(res.ok){
              card.remove();
              showToast('✅ Đã khôi phục task!');
              localStorage.removeItem('tt_sync_etag');
            }
          }catch(e){
            restoreBtn.disabled=false;restoreBtn.textContent='↩ Khôi phục';
          }
        }},['↩ Khôi phục']);
      card.appendChild(restoreBtn);
      listEl.appendChild(card);
    });
  }).catch(e=>{
    loadingEl.textContent='Lỗi tải: '+e.message;
  });

  return wrap;
}


// ─── Export Excel (CSV) ───────────────────────────────────────────────────────
function exportToCSV(data, filename){
  const BOM='﻿'; // UTF-8 BOM for Excel
  const csv=BOM+data.map(row=>
    row.map(cell=>{
      const s=String(cell===null||cell===undefined?'':cell);
      return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s;
    }).join(',')
  ).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;a.click();
  URL.revokeObjectURL(url);
}

async function exportReport(){
  const workerUrl=(getSyncCfg()||{}).workerUrl;
  if(!workerUrl){showToast('Cần kết nối Cloud Sync');return;}

  showToast('⏳ Đang xuất báo cáo...');
  try{
    const [summary, byUser, byCat, archived] = await Promise.all([
      fetch(workerUrl+'/report?type=summary').then(r=>r.json()),
      fetch(workerUrl+'/report?type=by_user').then(r=>r.json()),
      fetch(workerUrl+'/report?type=by_category').then(r=>r.json()),
      fetch(workerUrl+'/archived?limit=200').then(r=>r.json()),
    ]);

    const today=new Date().toLocaleDateString('vi-VN');

    // Sheet 1: Tổng quan
    const sheet1=[
      ['BÁO CÁO TASK TRACKER - '+today],
      [],
      ['TỔNG QUAN'],
      ['Tổng task','Hoàn thành','Quá hạn','Đã lưu trữ'],
      [summary.total||0, summary.done||0, summary.overdue||0, summary.archived||0],
      [],
      ['THEO TRẠNG THÁI'],
      ['Trạng thái','Số task'],
      ...(summary.byStatus||[]).map(r=>[r.status==='todo'?'Cần làm':r.status==='inprogress'?'Đang làm':'Hoàn thành', r.n]),
    ];

    // Sheet 2: Theo nhân viên
    const sheet2=[
      ['THEO NHÂN VIÊN - '+today],
      [],
      ['Nhân viên','Tổng task','Đã hoàn thành','Tiến độ TB (%)'],
      ...(byUser.data||[]).filter(r=>r.assignee).map(r=>[
        r.assignee, r.total||0, r.done||0, Math.round(r.avg_progress||0)
      ]),
    ];

    // Sheet 3: Theo category
    const sheet3=[
      ['THEO CATEGORY - '+today],
      [],
      ['Category','Tổng task','Đã hoàn thành','Tiến độ TB (%)'],
      ...(byCat.data||[]).map(r=>[
        r.name, r.total||0, r.done||0, Math.round(r.avg_progress||0)
      ]),
    ];

    // Sheet 4: Tasks hiện tại
    const tasks=S.tasks||[];
    const cats=S.categories||[];
    const sheet4=[
      ['DANH SÁCH TASK HIỆN TẠI - '+today],
      [],
      ['ID','Tiêu đề','Mô tả','Category','Nhân viên','Trạng thái','Tiến độ (%)','Ưu tiên','Deadline','Ngày tạo','Ghi chú'],
      ...tasks.map(t=>{
        const cat=cats.find(c=>c.id===t.categoryId);
        const statusMap={todo:'Cần làm',inprogress:'Đang làm',done:'Hoàn thành'};
        const priMap={high:'Cao',medium:'Trung bình',low:'Thấp'};
        return [
          t.id, t.title, t.desc||'', cat?cat.name:'', t.assignee||'',
          statusMap[t.status]||t.status, t.progress||0,
          priMap[t.priority]||t.priority,
          t.deadline?t.deadline.replace('T',' ').slice(0,16):'',
          t.date||'', t.notes||''
        ];
      }),
    ];

    // Sheet 5: Task đã archive
    const sheet5=[
      ['TASK ĐÃ LƯU TRỮ - '+today],
      [],
      ['ID','Tiêu đề','Nhân viên','Category','Ngày archive','Ghi chú'],
      ...(archived.tasks||[]).map(t=>{
        const cat=cats.find(c=>c.id===t.category_id);
        return [
          t.id, t.title, t.assignee||'', cat?cat.name:'',
          t.archived_at?new Date(t.archived_at).toLocaleDateString('vi-VN'):'',
          t.notes||''
        ];
      }),
    ];

    // Export từng sheet thành CSV riêng
    const dateStr=new Date().toISOString().slice(0,10);
    exportToCSV([...sheet1,[],[...Array(11).fill('')],[],...sheet2,[],[...Array(4).fill('')],[],...sheet3,[],[...Array(4).fill('')],[],...sheet4], 'BaoCao_TaskTracker_'+dateStr+'.csv');

    setTimeout(()=>exportToCSV(sheet4,'Tasks_HienTai_'+dateStr+'.csv'),500);
    setTimeout(()=>exportToCSV(sheet5,'Tasks_LuuTru_'+dateStr+'.csv'),1000);

    showToast('✅ Đã xuất 3 file báo cáo!');
  }catch(e){
    showToast('❌ Lỗi xuất báo cáo: '+e.message);
  }
}

function renderReportView(mobile){
  const wrap=div({style:{padding:mobile?'12px':'20px',maxWidth:900,margin:'0 auto'}});
  const workerUrl=(getSyncCfg()||{}).workerUrl;

  // Header
  wrap.appendChild(div({style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}},[
    div({style:{fontWeight:700,fontSize:18,color:'var(--text1)'}},[' 📊 Báo cáo']),
    div({style:{display:'flex',gap:8,alignItems:'center'}},[
      div({style:{fontSize:12,color:'var(--text3)'}},[new Date().toLocaleDateString('vi-VN')]),
      btn({className:'btn btn-secondary',style:{fontSize:12,padding:'5px 10px'},onClick:()=>exportReport()},['⬇ Xuất Excel']),
    ]),
  ]));

  if(!workerUrl){
    wrap.appendChild(div({style:{textAlign:'center',padding:40,color:'var(--text3)'}},[' Cần kết nối Cloud Sync để xem báo cáo']));
    return wrap;
  }

  // Loading state
  const loadingEl=div({style:{textAlign:'center',padding:40,color:'var(--text3)'}},[' Đang tải...']);
  wrap.appendChild(loadingEl);

  // Fetch report data
  Promise.all([
    fetch(workerUrl+'/report?type=summary').then(r=>r.json()),
    fetch(workerUrl+'/report?type=by_user').then(r=>r.json()),
    fetch(workerUrl+'/report?type=by_category').then(r=>r.json()),
  ]).then(([summary, byUser, byCat])=>{
    loadingEl.remove();

    // ── Summary cards ──
    const summaryGrid=div({style:{display:'grid',gridTemplateColumns:mobile?'repeat(2,1fr)':'repeat(4,1fr)',gap:12,marginBottom:24}});
    const cards=[
      {label:'Tổng task',value:summary.total||0,icon:'📋',color:'#4F46E5',bg:'#EEF2FF'},
      {label:'Hoàn thành',value:summary.done||0,icon:'✅',color:'#059669',bg:'#ECFDF5'},
      {label:'Quá hạn',value:summary.overdue||0,icon:'🔴',color:'#DC2626',bg:'#FEF2F2'},
      {label:'Đã lưu trữ',value:summary.archived||0,icon:'📦',color:'#D97706',bg:'#FFFBEB'},
    ];
    cards.forEach(c=>{
      summaryGrid.appendChild(div({style:{background:c.bg,borderRadius:'var(--r12)',padding:'16px',border:'1px solid '+c.color+'30'}},[ 
        div({style:{fontSize:24,marginBottom:4}},[c.icon]),
        div({style:{fontSize:28,fontWeight:700,color:c.color,lineHeight:1}},[String(c.value)]),
        div({style:{fontSize:12,color:'var(--text2)',marginTop:4}},[c.label]),
      ]));
    });
    wrap.appendChild(summaryGrid);

    // ── By status ──
    if(summary.byStatus&&summary.byStatus.length){
      const statusMap={todo:'📋 Cần làm',inprogress:'⚡ Đang làm',done:'✅ Hoàn thành'};
      const statusColors={todo:'#6B7280',inprogress:'#3B82F6',done:'#10B981'};
      const statusSection=div({style:{background:'white',borderRadius:'var(--r12)',padding:16,marginBottom:16,border:'1px solid var(--border)',boxShadow:'var(--s1)'}});
      statusSection.appendChild(div({style:{fontWeight:600,fontSize:14,marginBottom:12,color:'var(--text1)'}},[' Theo trạng thái']));
      const total=summary.byStatus.reduce((s,r)=>s+(r.n||0),0)||1;
      summary.byStatus.forEach(r=>{
        const pct=Math.round((r.n||0)/total*100);
        const row=div({style:{marginBottom:10}});
        row.appendChild(div({style:{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:4}},[
          span({style:{color:'var(--text1)',fontWeight:500}},[statusMap[r.status]||r.status]),
          span({style:{color:'var(--text2)'}},[r.n+' task ('+pct+'%)']),
        ]));
        const bar=div({style:{height:8,borderRadius:4,background:'#F3F4F6',overflow:'hidden'}});
        bar.appendChild(div({style:{height:'100%',width:pct+'%',background:statusColors[r.status]||'#6B7280',borderRadius:4,transition:'width .5s'}}));
        row.appendChild(bar);
        statusSection.appendChild(row);
      });
      wrap.appendChild(statusSection);
    }

    // ── By user ──
    if(byUser.data&&byUser.data.length){
      const userSection=div({style:{background:'white',borderRadius:'var(--r12)',padding:16,marginBottom:16,border:'1px solid var(--border)',boxShadow:'var(--s1)'}});
      userSection.appendChild(div({style:{fontWeight:600,fontSize:14,marginBottom:12,color:'var(--text1)'}},[' Theo nhân viên']));
      const maxTotal=Math.max(...byUser.data.map(r=>r.total||0))||1;
      byUser.data.forEach(r=>{
        if(!r.assignee)return;
        const pctDone=r.total?Math.round((r.done||0)/r.total*100):0;
        const row=div({style:{display:'flex',alignItems:'center',gap:12,marginBottom:12,padding:'8px 0',borderBottom:'1px solid var(--border)'}});
        // Avatar
        row.appendChild(div({style:{width:36,height:36,borderRadius:'50%',background:'var(--accent)',display:'flex',alignItems:'center',justifyContent:'center',color:'white',fontWeight:700,fontSize:13,flexShrink:0}},[r.assignee[0].toUpperCase()]));
        const info=div({style:{flex:1,minWidth:0}});
        info.appendChild(div({style:{fontWeight:600,fontSize:13,color:'var(--text1)',marginBottom:4}},[r.assignee]));
        const barWrap=div({style:{height:6,borderRadius:3,background:'#F3F4F6',overflow:'hidden',marginBottom:4}});
        barWrap.appendChild(div({style:{height:'100%',width:Math.round((r.total||0)/maxTotal*100)+'%',background:'var(--accent)',borderRadius:3}}));
        info.appendChild(barWrap);
        info.appendChild(div({style:{fontSize:11,color:'var(--text3)'}},[r.total+' task · '+r.done+' xong · TB '+Math.round(r.avg_progress||0)+'%']));
        row.appendChild(info);
        row.appendChild(div({style:{fontSize:16,fontWeight:700,color:pctDone>=80?'#10B981':pctDone>=50?'#F59E0B':'#EF4444',flexShrink:0}},[pctDone+'%']));
        userSection.appendChild(row);
      });
      wrap.appendChild(userSection);
    }

    // ── By category ──
    if(byCat.data&&byCat.data.length){
      const catSection=div({style:{background:'white',borderRadius:'var(--r12)',padding:16,marginBottom:16,border:'1px solid var(--border)',boxShadow:'var(--s1)'}});
      catSection.appendChild(div({style:{fontWeight:600,fontSize:14,marginBottom:12,color:'var(--text1)'}},[' Theo category']));
      byCat.data.forEach(r=>{
        const pctDone=r.total?Math.round((r.done||0)/r.total*100):0;
        const row=div({style:{display:'flex',alignItems:'center',gap:12,marginBottom:10,padding:'8px 0',borderBottom:'1px solid var(--border)'}});
        row.appendChild(div({style:{fontSize:24,flexShrink:0}},[r.icon||'📋']));
        const info=div({style:{flex:1}});
        info.appendChild(div({style:{fontWeight:600,fontSize:13,color:'var(--text1)',marginBottom:2}},[r.name]));
        info.appendChild(div({style:{fontSize:11,color:'var(--text3)'}},[r.total+' task · '+r.done+' xong · TB '+Math.round(r.avg_progress||0)+'%']));
        row.appendChild(info);
        row.appendChild(div({style:{fontSize:14,fontWeight:700,color:pctDone>=80?'#10B981':pctDone>=50?'#F59E0B':'#EF4444'}},[pctDone+'%']));
        catSection.appendChild(row);
      });
      wrap.appendChild(catSection);
    }

    // ── Payment summary ──
    const payments=getPayments();
    if(payments.length){
      const pending=payments.filter(p=>p.status==='pending');
      const approved=payments.filter(p=>p.status==='approved');
      const paid=payments.filter(p=>p.status==='paid');
      const totalPending=pending.reduce((s,p)=>s+Number(p.amount||0),0);
      const totalPaid=paid.reduce((s,p)=>s+Number(p.amount||0),0);

      const paySection=div({style:{background:'white',borderRadius:'var(--r12)',padding:16,marginBottom:16,border:'1px solid var(--border)',boxShadow:'var(--s1)'}});
      paySection.appendChild(div({style:{fontWeight:600,fontSize:14,marginBottom:12,color:'var(--text1)'}},[' Thanh toán']));
      const payGrid=div({style:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8}});
      [
        {label:'Chờ duyệt',value:pending.length,amount:totalPending,color:'#D97706',bg:'#FFFBEB'},
        {label:'Đã duyệt',value:approved.length,amount:approved.reduce((s,p)=>s+Number(p.amount||0),0),color:'#059669',bg:'#ECFDF5'},
        {label:'Đã thanh toán',value:paid.length,amount:totalPaid,color:'#4F46E5',bg:'#EEF2FF'},
      ].forEach(c=>{
        payGrid.appendChild(div({style:{background:c.bg,borderRadius:8,padding:12,textAlign:'center'}},[ 
          div({style:{fontSize:20,fontWeight:700,color:c.color}},[String(c.value)]),
          div({style:{fontSize:10,color:'var(--text2)',margin:'2px 0'}},[c.label]),
          div({style:{fontSize:11,fontWeight:600,color:c.color}},[formatMoney(c.amount)]),
        ]));
      });
      paySection.appendChild(payGrid);
      wrap.appendChild(paySection);
    }

  }).catch(e=>{
    loadingEl.textContent='Lỗi tải báo cáo: '+e.message;
  });

  return wrap;
}

function render(){
  // Auth check — nếu chưa login thì không render app
  if(!S.loading&&(!S.currentUser||!isSessionValid())){
    showLoginScreen(getUsers());
    return;
  }
  const app=document.getElementById('app');
  app.innerHTML='';
  if(S.loading){
    app.appendChild(div({style:{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',flexDirection:'column',gap:16,background:'var(--bg)'}},[
      div({style:{width:36,height:36,border:'2.5px solid var(--border)',borderTopColor:'var(--gh-amber)',borderRadius:'50%',animation:'spin .7s linear infinite'}},[]),
      div({style:{fontSize:13,color:'var(--text3)',fontWeight:500,letterSpacing:'.02em'}},['Đang tải...']),
    ]));
    return;
  }

  const mobile=isMobile();
  const tasks=S.tasks||[];
  const cats=S.categories||[];
  const anyConnected=getAllTgConfigs(S.categories||[]).length>0;
  const selectedCat=S.selectedCatId?cats.find(c=>c.id===S.selectedCatId):null;

  // Filter visible tasks
  let visible=tasks;
  if(S.selectedCatId)visible=visible.filter(t=>t.categoryId===S.selectedCatId);
  if(S.filterAssignee)visible=visible.filter(t=>t.assignee===S.filterAssignee);
  if(S.filter==='overdue')visible=visible.filter(t=>t.status!=='done'&&diffMins(t.deadline)<0);
  else if(S.filter==='today')visible=visible.filter(t=>t.status!=='done'&&diffDays(t.deadline)===0);
  else if(S.filter==='upcoming')visible=visible.filter(t=>t.status!=='done'&&diffDays(t.deadline)>0&&diffDays(t.deadline)<=3);

// ─── Export / Import ────────────────────────────────────────────────────────
function exportData(){
  const data={tasks:S.tasks,categories:S.categories,payments:getPayments(),payMembers:getPayMembers(),payTgCfg:getPayTgCfg(),exportedAt:new Date().toISOString()};
  const json=JSON.stringify(data,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='tasktracker_'+new Date().toLocaleDateString('vi-VN').replace(/\//g,'-')+'.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('✅ Đã xuất file backup!');
}

function importData(){
  const input=document.createElement('input');
  input.type='file';
  input.accept='.json';
  input.onchange=async e=>{
    const file=e.target.files[0];
    if(!file)return;
    try{
      const text=await file.text();
      const data=JSON.parse(text);
      if(!data.tasks||!data.categories){showToast('❌ File không hợp lệ',false);return;}
      setState({tasks:data.tasks,categories:data.categories});
      lsSet('tt_tasks',data.tasks);
      lsSet('tt_categories',data.categories);
      if(Array.isArray(data.payments))lsSet('tt_payments',data.payments);
      if(Array.isArray(data.payMembers))lsSet('tt_pay_members',data.payMembers);
      if(data.payTgCfg&&data.payTgCfg.token)lsSet('tt_pay_tg_cfg',data.payTgCfg);
      showToast('✅ Đã import '+data.tasks.length+' task'+(data.payments?' + '+data.payments.length+' đề xuất':'')+'!');
      render();
    }catch(e){showToast('❌ Lỗi đọc file: '+e.message,false);}
  };
  input.click();
}

async function handleSaveTask(form,isNew){
  // Sync progress <-> status
  if(form.status==='done')form={...form,progress:100};
  else if((form.progress||0)===100&&form.status==='done')form={...form,progress:100};
  const d=todayStr();
  const cat=(S.categories||[]).find(c=>c.id===form.categoryId);
  const catProtected=!!(cat&&cat.passwordHash);
  const dlText=form.deadline?'\n⏰ Deadline: '+formatDate(form.deadline):'';
  const catText=cat?'\n🗂 '+cat.icon+' '+cat.name:'';
  if(isNew){
    const t={...form,id:Date.now(),date:d};
    saveTasks([...S.tasks,t]);
    showToast('✅ Đã tạo công việc mới!');
    notifyTask(t,cat,'📌 <b>Task mới được tạo</b>');
  }else{
    saveTasks(S.tasks.map(t=>t.id===form.id?{...form}:t));
    showToast('✅ Đã cập nhật!');
    notifyTask(form,cat,'✏️ <b>Task được cập nhật</b>');
  }
  setState({modal:null,modalData:null});
}

function handleDeleteTask(id){
  const t=S.tasks.find(x=>x.id===id);
  console.log('[DELETE] id='+id+' title='+(t?t.title:'?')+' tasks_before='+S.tasks.length);
  const after=S.tasks.filter(x=>x.id!==id);
  console.log('[DELETE] tasks_after='+after.length+' duplicates_same_title='+S.tasks.filter(x=>t&&x.title===t.title).length);
  saveTasks(after);
  showToast('🗑 Đã xóa công việc');
  const delCat=(S.categories||[]).find(c=>c.id===t?.categoryId);
  if(t)notify('🗑️ <b>Đã xóa</b>\n🔖 '+t.title,delCat);
  setState({modal:null,modalData:null});
}

// ─── Modal helpers ────────────────────────────────────────────────────────────
function showModal(content){
  // Remove any existing overlays first to prevent stacking
  document.querySelectorAll('.overlay-bg').forEach(el=>el.remove());
  const bg=div({className:'overlay-bg'},[content]);
  bg.addEventListener('click',e=>{if(e.target===bg)setState({modal:null,modalData:null})});
  document.getElementById('app').appendChild(bg);
}
function makeField(label,children){
  return div({className:'field'},[el('label',{},[label]),...children.filter(Boolean)]);
}
function makeSelect(name,value,options,onChange){
  const s=el('select',{className:'input',style:{background:'white'}},options.map(([v,l])=>el('option',{value:v,selected:v===value},[l])));
  s.addEventListener('change',e=>onChange(e.target.value));
  return s;
}

function renderSyncModal(){
  const cfg=getSyncCfg()||{workerUrl:''};
  const hasConfig=!!(cfg.workerUrl);

  const workerUrlInp=inp({className:'input',value:cfg.workerUrl||WORKER_URL,placeholder:'https://your-worker.workers.dev',style:{fontFamily:'monospace',fontSize:12}});

  const statusDiv=div({style:{fontSize:12,padding:'8px 12px',borderRadius:'var(--r8)',display:'none',marginTop:8,fontWeight:500}});
  function setStatus(msg,type){
    statusDiv.textContent=msg;
    statusDiv.style.display='block';
    const colors={ok:{bg:'#ECFDF5',c:'#065f46',border:'#A7F3D0'},error:{bg:'#FEF2F2',c:'#991B1B',border:'#FECACA'},info:{bg:'#EFF6FF',c:'#1e40af',border:'#BFDBFE'}};
    const col=colors[type]||colors.info;

  }

  const connectBtn=btn({className:'btn btn-primary',style:{flex:1},onClick:async()=>{
    const workerUrl=workerUrlInp.value.trim().replace(/\/$/,'');

      setStatus('Đang kiểm tra kết nối...','info');

      lsSet('tt_sync_cfg',{workerUrl});
      const cloudRes=await fetch(workerUrl+'/data');
      const cloudData=await cloudRes.json();
      const cloudCount=(cloudData.tasks||[]).length;
      const localCount=(S.tasks||[]).length;
      connectBtn.textContent='Đã kết nối';
      if(cloudCount>0&&localCount>0){
        // Cả hai có data — hỏi user

        row.appendChild(bCloud);row.appendChild(bLocal);

// ─── Reminder Modal ───────────────────────────────────────────────────────────
function renderReminderModal(){
  const{tasks}=S.modalData||{tasks:[]};
  if(!tasks||!tasks.length){setState({modal:null,modalData:null});return;}
  const isDue=tasks.some(t=>t.type==='due');
  const isWarn=tasks.some(t=>t.type==='warn15');

  // Try browser notification
  if(isDue&&'Notification' in window&&Notification.permission==='granted'){
    tasks.filter(t=>t.type==='due').forEach(t=>{
      new Notification('🚨 Đến deadline!',{body:t.title+(t.assignee?' — '+t.assignee:''),icon:'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚨</text></svg>'});
    });
  }

  const accentColor=isDue?'#DC2626':'#D97706';
  const bgColor=isDue?'#FEF2F2':'#FFFBEB';
  const borderColor=isDue?'#FECACA':'#FDE68A';
  const icon=isDue?'🚨':'⏰';
  const title=isDue?'ĐẾN DEADLINE!':'Sắp đến deadline — còn 15 phút!';

  const taskCards=tasks.map(t=>{
    const pct=t.progress||0;
    const filled=Math.round(pct/10);
    const progBar='█'.repeat(filled)+'░'.repeat(10-filled);
    const catColor=t.cat?t.cat.color:'#6366f1';
    return div({style:{background:'white',borderRadius:'var(--r12)',padding:'12px 14px',marginBottom:8,borderLeft:'3px solid '+catColor,border:'1px solid #e5e7eb',borderLeftColor:catColor}},[
      div({style:{fontSize:13,fontWeight:700,color:'var(--text1)',marginBottom:6}},[t.title]),
      div({style:{display:'flex',flexWrap:'wrap',gap:6,fontSize:11,color:'var(--text2)'}},[
        t.assignee?span({style:{background:'#f3f4f6',padding:'2px 7px',borderRadius:4}},[' 👤 '+t.assignee]):null,
        t.cat?span({style:{background:catColor+'15',color:catColor,padding:'2px 7px',borderRadius:4}},[t.cat.icon+' '+t.cat.name]):null,
        span({style:{background:'#f3f4f6',padding:'2px 7px',borderRadius:4}},['🕐 '+formatDate(t.deadline)]),
      ]),
      div({style:{marginTop:8}},[
        div({style:{display:'flex',alignItems:'center',gap:6}},[
          div({style:{flex:1,height:5,background:'#e5e7eb',borderRadius:4,overflow:'hidden'}},[
            div({style:{height:'100%',width:pct+'%',background:pct>=100?'#059669':pct>=60?'#2563EB':pct>=30?'#D97706':'#94A3B8',borderRadius:4}})
          ]),
          span({style:{fontSize:11,fontWeight:700,color:'var(--text2)',minWidth:32}},[pct+'%']),
        ]),
      ]),
      div({style:{display:'flex',gap:6,marginTop:8}},[
        btn({style:{flex:1,padding:'7px',borderRadius:'var(--r8)',border:'1.5px solid #e5e7eb',background:'white',fontSize:12,fontWeight:600,color:'var(--text2)'},onClick:()=>{setState({modal:null,modalData:null});openTaskModal(S.tasks.find(x=>x.id===t.id));}},[' ✏️ Cập nhật']),
      ]),
    ]);
  });

  const modalEl=div({className:'modal',style:{maxWidth:480}},[
    // Header with pulsing icon
    div({style:{textAlign:'center',padding:'4px 0 16px'}},[
      div({style:{fontSize:48,marginBottom:8,animation:isDue?'pulse 1s ease infinite':'none'}},[icon]),
      div({style:{fontSize:18,fontWeight:800,color:accentColor,letterSpacing:'-.02em'}},[title]),
      div({style:{fontSize:12,color:'var(--text3)',marginTop:4}},[tasks.length+' công việc cần chú ý']),
    ]),
    // Task list
    div({style:{background:bgColor,border:'1px solid '+borderColor,borderRadius:'var(--r12)',padding:12,marginBottom:12}},taskCards),
    // Actions
    div({style:{display:'flex',gap:8}},[
      btn({className:'btn btn-secondary',style:{flex:1},onClick:()=>setState({modal:null,modalData:null})},['Đóng']),
      isDue?btn({className:'btn btn-primary',style:{flex:1,background:accentColor},onClick:()=>{
        // Open first task for quick update
        const first=S.tasks.find(x=>x.id===tasks[0].id);
        setState({modal:null,modalData:null});
        if(first)openTaskModal(first);
      }},['⚡ Cập nhật ngay']):null,
    ]),
  ]);

  // Add pulse animation style if not already present
  if(!document.getElementById('reminder-style')){
    const style=document.createElement('style');
    style.id='reminder-style';
    style.textContent='@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}';
    document.head.appendChild(style);
  }

  // Request notification permission on first deadline
  if('Notification' in window&&Notification.permission==='default'){
    Notification.requestPermission();
  }

  showModal(modalEl);
}

function formatMoney(n){
  return Number(n||0).toLocaleString('vi-VN')+'đ';
}

function buildVietQR(bankCode,accountNo,amount,description,accountName){
  // VietQR API: https://api.vietqr.io/v2/generate
  const body={
    accountNo:accountNo,
    accountName:accountName||'',
    acqId:bankCode,
    amount:Number(amount||0),
    addInfo:description||'',
    format:'text',
    template:'compact'
  };
  return fetch('https://api.vietqr.io/v2/generate',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-client-id':'task-tracker','x-api-key':'sandbox'},
    body:JSON.stringify(body)
  }).then(r=>r.json());
}

function showPhotoLightbox(urls, startIdx=0){
  let cur=startIdx;
  const overlay=div({style:{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(0,0,0,0.92)',zIndex:9999,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:12}});

  const img=el('img',{style:{maxWidth:'90vw',maxHeight:'75vh',objectFit:'contain',borderRadius:8,boxShadow:'0 4px 32px rgba(0,0,0,0.5)'}});
  const counter=div({style:{color:'white',fontSize:13,opacity:0.8}});
  const update=()=>{img.src=urls[cur];counter.textContent=(cur+1)+' / '+urls.length;};

  const btnStyle={background:'rgba(255,255,255,0.15)',border:'none',color:'white',fontSize:22,borderRadius:8,padding:'8px 18px',cursor:'pointer'};
  const prev=btn({style:btnStyle,onClick:()=>{cur=(cur-1+urls.length)%urls.length;update();}},[' ‹ ']);
  const next=btn({style:btnStyle,onClick:()=>{cur=(cur+1)%urls.length;update();}},[' › ']);
  const close=btn({style:{...btnStyle,position:'absolute',top:16,right:16,fontSize:18},onClick:()=>overlay.remove()},['✕']);
  const openBtn=btn({style:{...btnStyle,fontSize:13},onClick:()=>window.open(urls[cur],'_blank')},['🔗 Mở tab mới']);

  const nav=div({style:{display:'flex',gap:12,alignItems:'center'}});
  if(urls.length>1){nav.appendChild(prev);nav.appendChild(counter);nav.appendChild(next);}
  nav.appendChild(openBtn);

  overlay.appendChild(close);
  overlay.appendChild(img);
  overlay.appendChild(nav);
  overlay.addEventListener('click',(e)=>{if(e.target===overlay)overlay.remove();});
  document.body.appendChild(overlay);
  update();
}



function renderChangePassModal(){
  const cur=getLoginPasswords();
  let newStaff=cur.staff, newManager=cur.manager;
  let msg='';

  const field=(label,val,onChange)=>div({style:{marginBottom:12}},[
    div({style:{fontSize:12,fontWeight:600,color:'var(--text2)',marginBottom:4}},[label]),
    (() => {
      const inp=el('input',{type:'text',value:val,style:{width:'100%',padding:'8px 12px',borderRadius:'var(--r8)',border:'1.5px solid var(--border2)',fontSize:14,boxSizing:'border-box'}});
      inp.addEventListener('input',e=>onChange(e.target.value));
      return inp;
    })()
  ]);

  const modalEl=div({className:'modal',style:{maxWidth:400}},[
    div({style:{fontSize:17,fontWeight:800,marginBottom:16,color:'var(--text1)'}},[' 🔑 Quản lý mật khẩu']),
    field('Mật khẩu Nhân viên (Tasks)',newStaff,v=>newStaff=v),
    field('Mật khẩu Quản lý (Tasks + Thanh toán)',newManager,v=>newManager=v),
    msg?div({style:{color:'#059669',fontSize:13,marginBottom:8,fontWeight:600}},[msg]):null,
    div({style:{display:'flex',gap:8}},[
      btn({className:'btn btn-secondary',style:{flex:1},onClick:()=>setState({modal:null})},['Hủy']),
      btn({className:'btn btn-primary',style:{flex:1},onClick:()=>{
        if(!newStaff||!newManager){showToast('❌ Mật khẩu không được để trống');return;}
        if(newStaff===newManager){showToast('❌ 2 mật khẩu không được giống nhau');return;}
        saveLoginPasswords({staff:newStaff,manager:newManager});
        showToast('✅ Đã lưu mật khẩu mới!');
        setState({modal:null});
      }},['💾 Lưu']),
    ]),
  ].filter(Boolean));
  showModal(modalEl);
}

function renderLoginModal(){
  const [pass, setPass] = [()=>'', null];
  let inputVal='';
  let errMsg='';

  function tryLogin(){
    if(inputVal===getLoginPasswords().manager){
      S.role='manager';
      lsSet('tt_role','manager');
      lsSet('tt_role_exp',Date.now()+LOGIN_SESSION_HOURS*3600*1000);
      setState({modal:null,activeView:'tasks'});
      showToast('👋 Xin chào Quản lý!');
    } else if(inputVal===getLoginPasswords().staff){
      S.role='staff';
      lsSet('tt_role','staff');
      lsSet('tt_role_exp',Date.now()+LOGIN_SESSION_HOURS*3600*1000);
      setState({modal:null,activeView:'tasks'});
      showToast('👋 Xin chào!');
    } else {
      errMsg='❌ Mật khẩu không đúng';
      render();
    }
  }

  const inp=el('input',{type:'password',placeholder:'Nhập mật khẩu...',style:{width:'100%',padding:'10px 14px',borderRadius:'var(--r8)',border:'1.5px solid var(--border2)',fontSize:15,outline:'none',boxSizing:'border-box'}});
  inp.value=inputVal;
  inp.addEventListener('input',e=>{inputVal=e.target.value;errMsg='';});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin();});

  const modalEl=div({className:'modal',style:{maxWidth:360,textAlign:'center'}},[
    div({style:{fontSize:40,marginBottom:8}},['🔐']),
    div({style:{fontSize:20,fontWeight:800,marginBottom:4,color:'var(--text1)'}},[' Task Tracker']),
    div({style:{fontSize:13,color:'var(--text3)',marginBottom:20}},['Nhập mật khẩu để đăng nhập']),
    div({style:{marginBottom:12}},[inp]),
    errMsg?div({style:{color:'#DC2626',fontSize:13,marginBottom:10}},[errMsg]):null,
    btn({className:'btn btn-primary',style:{width:'100%',padding:'11px'},onClick:tryLogin},['Đăng nhập']),
  ].filter(Boolean));

  setTimeout(()=>inp.focus(),100);
  showModal(modalEl, false); // false = không cho đóng bằng click ngoài
}
